<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b141a">
  <meta name="mobile-web-app-capable" content="yes">
  <title>WhatsApp Directo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#16362d 0%,#0b141a 34%,#081015 100%);color:#e9edef;display:grid;place-items:center;padding:24px}
    .app{width:min(100%,430px);background:rgba(17,27,33,.96);border:1px solid rgba(255,255,255,.06);border-radius:28px;padding:28px 22px 24px;box-shadow:0 24px 70px rgba(0,0,0,.38)}
    .logo{width:74px;height:74px;border-radius:22px;display:grid;place-items:center;margin:0 auto 16px;background:#25d366;box-shadow:0 12px 28px rgba(37,211,102,.25);font-size:38px}
    h1{font-size:27px;line-height:1.1;text-align:center;margin:0 0 8px}
    .sub{color:#8696a0;text-align:center;font-size:14px;line-height:1.45;margin-bottom:24px}
    label{display:block;font-size:13px;color:#b9c4ca;margin:0 0 8px 3px;font-weight:600}
    input{width:100%;border:1px solid transparent;outline:none;background:#202c33;color:#e9edef;border-radius:16px;padding:17px 16px;font-size:21px;letter-spacing:.5px}
    input:focus{border-color:rgba(37,211,102,.65)}
    .hint{color:#8696a0;font-size:12px;margin:8px 3px 18px}
    button{width:100%;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:750;background:#25d366;color:#062d16;cursor:pointer;box-shadow:0 10px 24px rgba(37,211,102,.16)}
    button:active{transform:scale(.985);background:#1faa52}
    .error{min-height:21px;color:#ff6b6b;font-size:13px;padding:10px 3px 0}
    .foot{text-align:center;color:#667781;font-size:11px;margin-top:16px}
  </style>
</head>
<body>
  <main class="app">
    <div class="logo">💬</div>
    <h1>WhatsApp Directo</h1>
    <div class="sub">Abrí un chat sin guardar el contacto.</div>
    <label for="phone">Número de celular</label>
    <input id="phone" type="tel" inputmode="numeric" autocomplete="off" placeholder="099 123 456" autofocus>
    <div class="hint">Acepta 099123456, 59899123456 o +59899123456.</div>
    <button id="openBtn">ABRIR CHAT</button>
    <div id="error" class="error"></div>
    <div class="foot">Uruguay · código +598 automático</div>
  </main>
<script>
const input=document.getElementById('phone');
const error=document.getElementById('error');
const btn=document.getElementById('openBtn');

function normalizeUY(raw){
  let n=(raw||'').replace(/\D/g,'');
  if(!n) throw new Error('Escribí un número.');
  if(n.startsWith('00598')) n=n.slice(2);
  if(n.startsWith('598')) n=n.slice(3);
  if(n.startsWith('0')) n=n.slice(1);
  if(n.length!==8 || !n.startsWith('9')) throw new Error('Revisá el número. Ejemplo: 099123456.');
  return '598'+n;
}
function openWhatsApp(){
  error.textContent='';
  try{
    const number=normalizeUY(input.value);
    window.location.href='https://wa.me/'+number;
  }catch(e){
    error.textContent=e.message;
    input.focus();
  }
}
btn.addEventListener('click',openWhatsApp);
input.addEventListener('keydown',e=>{if(e.key==='Enter')openWhatsApp();});

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
